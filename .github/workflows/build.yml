name: Build

# Builds only when app code changes (the repo is private: Windows minutes count double).
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "ui/**"
      - "package.json"
      - "tests/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The installer maker (NSIS) Tauri downloads from GitHub: kept between builds, since that download sometimes fails (504).
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-tools-nsis-3.13
      # The map's pure parts (SNMP layout and merge, UniFi parsing): plain Node, a second or two.
      - run: node tests/netmap.test.js
      - run: node --test tests/surveyrange.test.js
      - run: npm install --no-audit --no-fund
      # Tries again if a download fails; the second try reuses what was compiled.
      - run: |
          for ($i = 1; $i -le 3; $i++) {
            npx tauri build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Build try $i failed; trying again in 30 s"
            Start-Sleep -Seconds 30
          }
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ARPradar-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

  # Linux packages (.deb, AppImage): switched off until step 6.
  linux:
    if: false
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install --no-audit --no-fund
      - run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: ARPradar-Linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14
