[package]
name = "arpradar-sensor"
version = "0.2.0"
description = "ARPradar's scan engine without a window, for the Raspberry Pi sensor and other Linux boxes"
authors = ["Sean O'Neill"]
license = "GPL-3.0-or-later"
repository = "https://github.com/saoneill01-a11y/arpradar-windows"
edition = "2021"

# The engine files are shared with the Windows app (../src-tauri/src); see src/main.rs.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
netdev = "0.31"
dns-lookup = "2"
native-tls = "0.2"
x509-parser = "0.16"
sha2 = "0.10"
keyring = "3"
open = "5"
aes-gcm = "0.10"
hmac = "0.12"
getrandom = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.5", features = ["all"] }
bluer = { version = "0.17", features = ["bluetoothd"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
futures = "0.3"

[profile.release]
strip = true
opt-level = "s"
